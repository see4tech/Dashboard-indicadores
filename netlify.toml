[build]
  publish = "."
  functions = "netlify/functions"

# /api/* → función serverless que proxea al API de SB
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/sb-api/:splat"
  status = 200
  force = true

# SPA fallback: cualquier otra ruta sirve index.html (por si añadimos rutas)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[functions."sb-api"]
  # Free plan permite hasta 26s sincrónico
  timeout = 26
